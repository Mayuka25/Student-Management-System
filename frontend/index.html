<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Student Management System</h1>
            <p>Manage student records easily and efficiently</p>
        </header>

        <!-- Add Student Section -->
        <section class="form-section">

            <h2>Add Student</h2>

            <form id="studentForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="name">Student Name</label>
                        <input type="text" id="name" placeholder="Enter student name" required>
                    </div>

                    <div class="form-group">
                        <label for="register_number">Register Number</label>
                        <input type="text" id="register_number" placeholder="Enter register number" required>
                    </div>

                    <div class="form-group">
                        <label for="department">Department</label>
                        <input type="text" id="department" placeholder="Enter department" required>
                    </div>

                    <div class="form-group">
                        <label for="year">Year</label>
                        <select id="year" required>
                            <option value="">Select Year</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter email" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="Enter phone number" required>
                    </div>

                </div>

                <button type="submit" id="submitBtn">
                    Add Student
                </button>

            </form>

            <p id="message"></p>

        </section>

<!-- Edit Student Section -->
<section class="form-section" id="editSection" style="display: none;">

    <h2>Edit Student</h2>

    <form id="editForm">

        <input type="hidden" id="editId">

        <div class="form-grid">

            <div class="form-group">
                <label for="editName">Student Name</label>
                <input type="text" id="editName" required>
            </div>

            <div class="form-group">
                <label for="editRegisterNumber">Register Number</label>
                <input type="text" id="editRegisterNumber" required>
            </div>

            <div class="form-group">
                <label for="editDepartment">Department</label>
                <input type="text" id="editDepartment" required>
            </div>

            <div class="form-group">
                <label for="editYear">Year</label>

                <select id="editYear" required>
                    <option value="">Select Year</option>
                    <option value="1">1st Year</option>
                    <option value="2">2nd Year</option>
                    <option value="3">3rd Year</option>
                    <option value="4">4th Year</option>
                </select>
            </div>

            <div class="form-group">
                <label for="editEmail">Email</label>
                <input type="email" id="editEmail" required>
            </div>

            <div class="form-group">
                <label for="editPhone">Phone Number</label>
                <input type="tel" id="editPhone" required>
            </div>

        </div>

        <button type="submit" id="updateBtn">
            Update Student
        </button>

        <button type="button" id="cancelEditBtn">
            Cancel
        </button>

        <p id="editMessage"></p>

    </form>

</section>
        <!-- Student Records Section -->
        <section class="records-section">

            <div class="records-header">

                <div>
                    <h2>Student Records</h2>
                    <p>View and manage all student details</p>
                </div>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search students..."
                >

            </div>


            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Register No.</th>
                            <th>Department</th>
                            <th>Year</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="studentTableBody">
                        <!-- Student data will appear here -->
                    </tbody>

                </table>

            </div>

            <p id="emptyMessage">
                No student records found.
            </p>

        </section>

    </div>

    <script src="script.js"></script>

</body>

</html>
